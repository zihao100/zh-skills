name: Validate Skills Specification

on:
  push:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'skills/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Skill Specification Linter
        run: |
          python3 scripts/validate_skills.py
